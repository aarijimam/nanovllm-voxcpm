[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-voxcpm-deployment"
version = "0.0.0"
description = "FastAPI service wrapper for nano-vllm-voxcpm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nano-vllm-voxcpm",
    "fastapi[standard]",
    "aiohttp",
    "prometheus_client",
    "lameenc",
    "boto3",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv.sources]
nano-vllm-voxcpm = { workspace = true }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.17/flash_attn-2.8.3+cu130torch2.12-cp312-cp312-linux_x86_64.whl" }

